bio: |
    I am a Assistant Professor at the [Universidade Federal Rural de Pernambuco (UFRPE)](https://www.ufrpe.br/) and a member of the [SecLab](https://www.dc.ufrpe.br/node/14). My research spans distributed systems, self-adaptive systems, artificial intelligence, and cybersecurity, with a particular interest in microservices, cloud computing, and cyber threat intelligence. Previously, I was a researcher at CISSA, an EMBRAPII Competence Center for Cybersecurity at CESAR, where I worked on applied cybersecurity research.

